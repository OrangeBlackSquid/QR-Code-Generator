<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>qr</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    min-height: 100%;
    background: #0d1014;
    color: #e8ebee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }

  :root {
    --bg: #0d1014;
    --surface: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text: #e8ebee;
    --sub: #5c6169;
    --success: #34d399;
    --error: #f87171;
  }

  .app {
    max-width: 520px;
    margin: 0 auto;
    padding: 40px 24px 60px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  header {
    display: flex;
    flex-direction: column;
    gap: 22px;
    align-items: center;
  }

  .logo {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -1.5px;
    color: var(--text);
    line-height: 1;
  }

  .tabs {
    display: flex;
    background: var(--surface);
    border-radius: 100px;
    padding: 4px;
    width: 100%;
    max-width: 280px;
    gap: 2px;
  }

  .tab-btn {
    flex: 1;
    padding: 10px 16px;
    border: none;
    background: transparent;
    color: var(--sub);
    border-radius: 100px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: all 0.18s ease;
    font-family: inherit;
    text-transform: lowercase;
  }

  .tab-btn.active {
    background: var(--text);
    color: var(--bg);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .panel {
    display: none;
    flex-direction: column;
    gap: 20px;
    animation: fadeIn 0.25s ease-out;
  }

  .panel.active {
    display: flex;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes revealDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  textarea {
    width: 100%;
    min-height: 130px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    resize: none;
    outline: none;
    transition: border-color 0.18s ease;
    -webkit-appearance: none;
  }

  textarea::placeholder {
    color: var(--sub);
  }

  textarea:focus {
    border-color: var(--border-strong);
  }

  .primary-btn {
    width: 100%;
    padding: 17px;
    border: none;
    background: var(--text);
    color: var(--bg);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border-radius: 100px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
    text-transform: lowercase;
  }

  .primary-btn:active {
    transform: scale(0.98);
    opacity: 0.9;
  }

  .primary-btn:disabled {
    opacity: 0.35;
    cursor: default;
    transform: none;
  }

  .secondary-btn {
    padding: 13px 26px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 100px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-transform: lowercase;
  }

  .secondary-btn:active {
    background: var(--surface);
    transform: scale(0.97);
  }

  .secondary-btn.copied {
    color: var(--success);
    border-color: var(--success);
  }

  .qr-result {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding-top: 4px;
    animation: revealDown 0.3s ease-out;
  }

  .qr-card {
    background: #ffffff;
    padding: 20px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: 100%;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  }

  .qr-card canvas {
    display: block;
    width: min(72vw, 300px);
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .qr-meta {
    font-size: 11px;
    color: var(--sub);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .error-msg {
    font-size: 13px;
    color: var(--error);
    text-align: center;
    padding: 14px;
    background: rgba(248, 113, 113, 0.08);
    border-radius: 12px;
    border: 1px solid rgba(248, 113, 113, 0.2);
  }

  .upload-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 56px 24px;
    border: 2px dashed var(--border-strong);
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.18s ease;
    color: var(--sub);
    font-size: 14px;
    text-align: center;
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  .upload-zone:active {
    background: var(--surface);
    border-color: var(--text);
    color: var(--text);
  }

  .upload-zone svg {
    width: 44px;
    height: 44px;
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.55;
  }

  .read-result {
    display: flex;
    flex-direction: column;
    gap: 16px;
    animation: revealDown 0.3s ease-out;
  }

  .result-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    font-size: 15px;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
    max-height: 260px;
    overflow-y: auto;
    color: var(--text);
    font-family: inherit;
  }

  .result-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .helper-text {
    font-size: 12px;
    color: var(--sub);
    text-align: center;
    line-height: 1.5;
    margin-top: 6px;
  }

  @media (max-width: 400px) {
    .app {
      padding: 32px 18px 50px;
    }
    .logo {
      font-size: 30px;
    }
    .qr-card {
      padding: 16px;
    }
    .qr-card canvas {
      width: min(76vw, 280px);
    }
  }
</style>
</head>
<body>

<div class="app">

  <header>
    <div class="logo">qr</div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="create">create</button>
      <button class="tab-btn" data-tab="read">read</button>
    </div>
  </header>

  <main>

    <section id="panel-create" class="panel active">
      <textarea id="input" placeholder="type or paste anything..." autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"></textarea>

      <button id="generateBtn" class="primary-btn" disabled>generate</button>

      <div id="createError" class="error-msg" hidden></div>

      <div id="qrResult" class="qr-result" hidden>
        <div class="qr-card">
          <canvas id="qrCanvas"></canvas>
        </div>
        <div class="qr-meta" id="qrMeta"></div>
        <button id="downloadBtn" class="secondary-btn">download</button>
      </div>
    </section>

    <section id="panel-read" class="panel">
      <label class="upload-zone" for="fileInput">
        <svg viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>tap to upload a qr code</span>
      </label>
      <input type="file" id="fileInput" accept="image/*" hidden>

      <div id="readError" class="error-msg" hidden></div>

      <div id="readResult" class="read-result" hidden>
        <div class="result-box" id="readText"></div>
        <div class="result-actions">
          <button id="copyBtn" class="secondary-btn">copy</button>
        </div>
      </div>
    </section>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(() => {
'use strict';

const tabBtns = document.querySelectorAll('.tab-btn');
const panels = {
  create: document.getElementById('panel-create'),
  read: document.getElementById('panel-read')
};

const inputEl = document.getElementById('input');
const generateBtn = document.getElementById('generateBtn');
const createError = document.getElementById('createError');
const qrResult = document.getElementById('qrResult');
const qrCanvas = document.getElementById('qrCanvas');
const qrMeta = document.getElementById('qrMeta');
const downloadBtn = document.getElementById('downloadBtn');

const fileInput = document.getElementById('fileInput');
const readError = document.getElementById('readError');
const readResult = document.getElementById('readResult');
const readText = document.getElementById('readText');
const copyBtn = document.getElementById('copyBtn');

let currentDataURL = '';
let currentDecodedText = '';

function switchTab(name) {
  tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  Object.keys(panels).forEach(k => panels[k].classList.toggle('active', k === name));
}

tabBtns.forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

function updateGenerateBtn() {
  generateBtn.disabled = inputEl.value.trim().length === 0;
}

inputEl.addEventListener('input', updateGenerateBtn);
updateGenerateBtn();

function showCreateError(msg) {
  createError.textContent = msg;
  createError.hidden = false;
  qrResult.hidden = true;
}

function hideCreateError() {
  createError.hidden = true;
}

function renderQR(text) {
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();

  const moduleCount = qr.getModuleCount();
  const borderModules = 4;
  const totalModules = moduleCount + borderModules * 2;

  let cellSize;
  if (totalModules < 50) cellSize = 16;
  else if (totalModules < 90) cellSize = 12;
  else if (totalModules < 140) cellSize = 9;
  else cellSize = 7;

  const size = totalModules * cellSize;

  qrCanvas.width = size;
  qrCanvas.height = size;

  const ctx = qrCanvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);

  ctx.fillStyle = '#0d1014';
  for (let row = 0; row < moduleCount; row++) {
    for (let col = 0; col < moduleCount; col++) {
      if (qr.isDark(row, col)) {
        const x = (col + borderModules) * cellSize;
        const y = (row + borderModules) * cellSize;
        ctx.fillRect(x, y, cellSize, cellSize);
      }
    }
  }

  return { moduleCount, size };
}

generateBtn.addEventListener('click', () => {
  const text = inputEl.value.trim();
  if (!text) return;

  hideCreateError();
  qrResult.hidden = true;

  try {
    const { moduleCount, size } = renderQR(text);
    currentDataURL = qrCanvas.toDataURL('image/png');

    qrMeta.textContent = moduleCount + ' × ' + moduleCount + ' modules · ' + size + 'px';

    qrResult.hidden = false;
    qrResult.style.animation = 'none';
    void qrResult.offsetWidth;
    qrResult.style.animation = '';
  } catch (e) {
    showCreateError('this text is too long to fit in a qr code');
  }
});

downloadBtn.addEventListener('click', () => {
  if (!currentDataURL) return;
  const a = document.createElement('a');
  a.href = currentDataURL;
  a.download = 'qr-code.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

function showReadError(msg) {
  readError.textContent = msg;
  readError.hidden = false;
  readResult.hidden = true;
}

function hideReadError() {
  readError.hidden = true;
}

function decodeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        try {
          const maxDim = 1400;
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;

          if (w > maxDim || h > maxDim) {
            const scale = maxDim / Math.max(w, h);
            w = Math.floor(w * scale);
            h = Math.floor(h * scale);
          }

          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          const cx = c.getContext('2d');
          cx.drawImage(img, 0, 0, w, h);

          const imageData = cx.getImageData(0, 0, w, h);
          const code = jsQR(imageData.data, w, h, { inversionAttempts: 'attemptBoth' });

          if (code && code.data) {
            resolve(code.data);
          } else {
            reject(new Error('no qr found'));
          }
        } catch (err) {
          reject(err);
        }
      };
      img.onerror = () => reject(new Error('could not load image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('could not read file'));
    reader.readAsDataURL(file);
  });
}

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;

  hideReadError();
  readResult.hidden = true;

  try {
    const text = await decodeImage(file);
    currentDecodedText = text;
    readText.textContent = text;
    readResult.hidden = false;
    readResult.style.animation = 'none';
    void readResult.offsetWidth;
    readResult.style.animation = '';
  } catch (err) {
    showReadError('no qr code found in this image');
  }

  fileInput.value = '';
});

async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}

  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    ta.setAttribute('readonly', '');
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

let copyTimeout = null;

copyBtn.addEventListener('click', async () => {
  if (!currentDecodedText) return;
  const ok = await copyToClipboard(currentDecodedText);
  if (!ok) return;

  copyBtn.classList.add('copied');
  copyBtn.textContent = 'copied';

  if (copyTimeout) clearTimeout(copyTimeout);
  copyTimeout = setTimeout(() => {
    copyBtn.classList.remove('copied');
    copyBtn.textContent = 'copy';
  }, 1500);
});

})();
</script>
</body>
  </html>
